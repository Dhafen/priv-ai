name: Verify iOS and Swiftlet

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'localLLM/**'
      - 'localLLM.xcodeproj/**'
      - 'dependencies/**'
      - 'scripts/**'
      - 'fastlane/**'
      - 'Gemfile*'
      - '.github/workflows/ios-verify.yml'

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 70
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch pinned Swiftlet
        run: python3 scripts/bootstrap.py
      - name: Verify published Qwen QPack metadata
        run: python3 scripts/check_model_source.py
      - name: Check distribution automation syntax
        run: |
          ruby -c fastlane/Fastfile
          bash -n scripts/prepare-signing.sh
      - name: Test Swiftlet container, streaming, cache and generation
        # Blocking concurrency probes have short deadlines; run suites serially
        # so unrelated Metal compilations cannot starve their executor threads.
        run: |
          swift test --package-path .dependencies/swiftlet --no-parallel --force-resolved-versions
          python3 scripts/check_dependency_locks.py engine
      - name: Resolve application dependencies
        run: |
          xcodebuild -version
          xcodebuild -resolvePackageDependencies -skipMacroValidation -onlyUsePackageVersionsFromResolvedFile \
            -project localLLM.xcodeproj -scheme localLLM
          python3 scripts/check_dependency_locks.py app
      - name: Build iPhone application with every inference engine
        run: |
          set -euo pipefail
          xcodebuild -project localLLM.xcodeproj -scheme localLLM \
            -skipMacroValidation -onlyUsePackageVersionsFromResolvedFile -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            DEVELOPMENT_TEAM='' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' build
      - name: Inspect application contents
        run: |
          python3 scripts/verify_app_bundle.py \
            "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/localLLM.app"
      - name: Save resolved dependency versions and model metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-verification
          include-hidden-files: true
          path: |
            localLLM.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
            .dependencies/swiftlet/Package.resolved
            build/model-source-verification.json
          retention-days: 1
          if-no-files-found: error
