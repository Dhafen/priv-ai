name: Deliver internal TestFlight beta

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: privai-testflight
  cancel-in-progress: false

jobs:
  check-configuration:
    runs-on: ubuntu-latest
    steps:
      - name: Check Apple configuration without exposing values
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
          IOS_DISTRIBUTION_P12_B64: ${{ secrets.IOS_DISTRIBUTION_P12_B64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_B64 }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APP_STORE_APP_ID: ${{ vars.APP_STORE_APP_ID }}
          TESTFLIGHT_INTERNAL_GROUP_ID: ${{ vars.TESTFLIGHT_INTERNAL_GROUP_ID }}
        run: |
          missing=0
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY_B64 \
            IOS_DISTRIBUTION_P12_B64 IOS_DISTRIBUTION_P12_PASSWORD \
            IOS_PROVISIONING_PROFILE_B64 APPLE_TEAM_ID APP_STORE_APP_ID \
            TESTFLIGHT_INTERNAL_GROUP_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing configuration: $name"
              missing=1
            fi
          done
          exit "$missing"

  verify:
    needs: check-configuration
    uses: ./.github/workflows/ios-verify.yml

  deliver:
    needs: verify
    runs-on: macos-26
    timeout-minutes: 90
    environment: testflight
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      FASTLANE_SKIP_UPDATE_CHECK: '1'
      FASTLANE_HIDE_CHANGELOG: '1'
      FASTLANE_OPT_OUT_USAGE: '1'
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
      IOS_DISTRIBUTION_P12_B64: ${{ secrets.IOS_DISTRIBUTION_P12_B64 }}
      IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
      IOS_PROVISIONING_PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_B64 }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APP_STORE_APP_ID: ${{ vars.APP_STORE_APP_ID }}
      TESTFLIGHT_INTERNAL_GROUP_ID: ${{ vars.TESTFLIGHT_INTERNAL_GROUP_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch pinned Swiftlet
        run: python3 scripts/bootstrap.py
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Install signing material into temporary keychain
        run: bash scripts/prepare-signing.sh
      - name: Archive, sign and upload to internal TestFlight
        run: bundle exec fastlane ios beta
      - name: Verify processing and attach build to the internal group
        run: bundle exec fastlane ios verify_beta
      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/privai-signing.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/privai-signing"
